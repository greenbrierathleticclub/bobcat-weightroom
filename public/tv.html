<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobcat Wall Board</title>
<link rel="stylesheet" href="/css/modern.css">
<style>
.tv { position: absolute; inset: 0; padding: 56px 64px 52px; display: flex; flex-direction: column; gap: 34px; }
.tv header { height: 112px; flex-shrink: 0; display: flex; align-items: center; gap: 30px; }
.tv h1 { margin: 0; font-family: var(--f-disp); font-weight: 900; font-size: 92px; line-height: 0.85; letter-spacing: 0.01em; }
.tv h2 { margin: 0; font-family: var(--f-cond); font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; }
.board { padding: 30px 26px 26px; display: flex; flex-direction: column; gap: 22px; }
.board-head { display: flex; align-items: center; gap: 16px; padding: 0 6px; }
.board-head .sub { font-weight: 600; font-size: 20px; line-height: 1; color: var(--gray); }
.lrow { height: 82px; padding: 0 26px 0 20px; border-radius: 18px; background: rgba(255,255,255,0.045); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); display: flex; align-items: center; gap: 18px; }
.lrow.top { height: 104px; border-radius: 22px; background: #fff; color: var(--green); box-shadow: var(--lift-shadow); }
.lrow .rk { width: 34px; flex-shrink: 0; font-family: var(--f-disp); font-weight: 800; font-size: 32px; line-height: 1; text-align: center; color: var(--gray); }
.lrow.top .rk { font-weight: 900; font-size: 44px; color: var(--green); }
.lrow .nm { font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -0.01em; }
.lrow.top .nm { font-weight: 700; font-size: 31px; color: #000; }
.lrow .ps { font-family: var(--f-cond); font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); }
.lrow.top .ps { font-size: 20px; color: var(--green); }
.lrow .mid { flex-shrink: 0; font-family: var(--f-cond); font-weight: 700; font-size: 21px; line-height: 1; letter-spacing: 0.04em; color: var(--gray); white-space: nowrap; }
.lrow.top .mid { font-size: 22px; color: #000; }
.lrow .big { font-family: var(--f-disp); font-weight: 800; font-size: 44px; line-height: 0.85; }
.lrow.top .big { font-weight: 900; font-size: 62px; letter-spacing: -0.01em; }
.lrow .small { font-family: var(--f-cond); font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: 0.06em; color: var(--gray); }
.lrow.top .small { font-size: 19px; color: #000; }
.lrow.compact { height: 80px; }
.lrow.top.compact { height: 100px; }
.empty { flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-cond); font-weight: 700; font-size: 30px; letter-spacing: 0.08em; color: var(--gray); line-height: 1.4; padding: 40px; }
.split { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.split div:first-child { font-family: var(--f-cond); font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: 0.16em; }
.split div:last-child { flex-grow: 1; height: 1px; background: rgba(255,255,255,0.14); }
.fade { animation: fadein 600ms ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>
<body class="screen">
<div class="viewport"><div class="stage ground-tv" id="stage"></div></div>
<script type="module" src="/js/tv.js"></script>
</body>
</html>
