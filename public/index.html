<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobcat Weight Room</title>
<link rel="stylesheet" href="/css/modern.css">
<style>
body { background: radial-gradient(1100px 620px at 50% -8%, rgba(9,74,40,0.9) 0%, rgba(9,74,40,0) 75%), var(--ground); min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 14px; }
a.btn { height: 76px; font-size: 28px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px">
    <div class="shield-glow" style="padding:16px;margin:-16px"><img src="/img/shield.svg" alt="Greenbrier Bobcat Shield" style="height:72px;width:100px"></div>
    <div class="disp" style="font-size:64px;line-height:0.85">BOBCAT<br>WEIGHT ROOM</div>
  </div>
  <a class="btn btn-main" href="/coach">COACH PAGE</a>
  <a class="btn btn-ghost" href="/tv">TV BOARD</a>
  <div id="racks" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>
</div>
<script type="module">
  const s = await fetch('/api/settings').then((r) => r.json());
  document.getElementById('racks').innerHTML = Array.from({ length: Number(s.rack_count) || 0 }, (_, i) => `<a class="btn btn-ghost" href="/rack/${i + 1}">RACK ${i + 1}</a>`).join('');
</script>
</body>
</html>
